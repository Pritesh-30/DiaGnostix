{% extends "auth_layout.html" %}
{% block title %}Create account{% endblock %}
{% block auth_form %}
<h2>Create your account</h2>
<p class="muted">It only takes a minute.</p>
<form method="post" class="form" novalidate>
  <label class="field">
    <span>Full name</span>
    <input type="text" name="full_name" required autocomplete="name" value="{{ request.form.full_name or '' }}">
  </label>
  <div class="grid-2">
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" required minlength="3" autocomplete="username" value="{{ request.form.username or '' }}">
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" required autocomplete="email" value="{{ request.form.email or '' }}">
    </label>
  </div>
  <label class="field">
    <span>Password <small class="muted">(min. 6 characters)</small></span>
    <div class="pw-wrap">
      <input type="password" name="password" id="password" required minlength="6" autocomplete="new-password">
      <button type="button" class="pw-toggle" onclick="togglePw('password', this)">Show</button>
    </div>
  </label>
  <label class="field">
    <span>Confirm password</span>
    <input type="password" name="confirm_password" required autocomplete="new-password">
  </label>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
{% block scripts %}
<script>
function togglePw(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? 'Show' : 'Hide';
}
</script>
{% endblock %}
